<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Pagamentos — Sábado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --pitch: #1B4332;
    --pitch-dark: #10281F;
    --chalk: #F7F5EF;
    --line: #DEDACD;
    --ink: #1C1C1A;
    --muted: #6B6A62;
    --gold: #C9971C;
    --gold-bg: #FBF0D6;
    --red: #B23A2F;
    --red-bg: #F8E4E1;
    --green: #2F6B3C;
    --green-bg: #E4EFE3;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--chalk);
    color:var(--ink);
    padding-bottom:60px;
  }
  header{
    background:var(--pitch);
    background-image: repeating-linear-gradient(90deg, var(--pitch) 0px, var(--pitch) 40px, var(--pitch-dark) 40px, var(--pitch-dark) 80px);
    color:var(--chalk);
    padding:28px 20px 24px;
  }
  .header-inner{max-width:720px;margin:0 auto;}
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  .subtitle{font-size:14px;opacity:0.85;margin:0;}
  main{max-width:720px;margin:0 auto;padding:20px;}

  .summary-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:24px;
  }
  .stat{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 12px;
    text-align:center;
  }
  .stat .num{font-size:22px;font-weight:700;}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;}
  .stat.debt .num{color:var(--red);}
  .stat.paid .num{color:var(--green);}

  section{margin-bottom:28px;}
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  h2{
    font-size:16px;
    font-weight:700;
    margin:0;
  }
  .add-row{display:flex;gap:8px;margin-bottom:12px;}
  input[type=text], input[type=date]{
    flex:1;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    border:1px solid var(--pitch);
    background:var(--pitch);
    color:#fff;
    padding:9px 16px;
    cursor:pointer;
  }
  button:active{opacity:0.85;}
  button.ghost{
    background:transparent;
    color:var(--pitch);
  }
  button.small{
    padding:5px 10px;
    font-size:12px;
  }
  button:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  .player-list{display:flex;flex-wrap:wrap;gap:8px;}
  .player-chip{
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 8px 6px 14px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:500;
  }
  .player-chip button{
    background:transparent;border:none;color:var(--muted);
    padding:2px 6px;font-size:14px;line-height:1;border-radius:50%;
  }
  .player-chip button:hover{color:var(--red);}

  .new-session-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .attendee-pick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0 12px;
  }
  .attendee-pick label{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px 6px 8px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .attendee-pick label.checked{
    border-color:var(--pitch);
    background:var(--green-bg);
  }
  .attendee-pick input{margin:0;}
  .attendee-hint{font-size:12px;color:var(--muted);margin:0 0 4px;}

  .session-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .session-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .session-date{font-weight:700;font-size:15px;}
  .session-sub{font-size:12px;color:var(--muted);}
  .remove-session{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;}
  .remove-session:hover{color:var(--red);}

  .pay-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 0;
    border-top:1px solid var(--line);
  }
  .pay-row:first-of-type{border-top:none;}
  .pay-name{font-size:14px;}
  .pay-toggle{
    border:1px solid var(--line);
    background:var(--red-bg);
    color:var(--red);
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:16px;
    cursor:pointer;
  }
  .pay-toggle.paid{
    background:var(--green-bg);
    color:var(--green);
  }

  .pending-list{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .pending-row{
    padding:12px 16px;
    border-top:1px solid var(--line);
  }
  .pending-row:first-child{border-top:none;}
  .pending-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .pending-name{font-weight:600;font-size:14px;}
  .pending-total{font-weight:700;font-size:14px;color:var(--red);}
  .pending-dates{display:flex;flex-wrap:wrap;gap:6px;}
  .pending-date-chip{
    background:var(--red-bg);
    color:var(--red);
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:12px;
  }

  .empty{
    color:var(--muted);
    font-size:13px;
    padding:14px;
    text-align:center;
    background:#fff;
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
  .empty.good{color:var(--green);border-color:var(--green-bg);}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Controle de pagamentos</h1>
    <p class="subtitle">Turma de sábado — <span id="price-display">R$ 13,00</span> por jogo</p>
    <p class="subtitle" id="sync-status" style="margin-top:6px;font-size:12px;">Conectando…</p>
  </div>
</header>

<main>

  <div class="summary-grid">
    <div class="stat"><div class="num" id="stat-players">0</div><div class="lbl">no elenco</div></div>
    <div class="stat paid"><div class="num" id="stat-paid">R$ 0</div><div class="lbl">recebido</div></div>
    <div class="stat debt"><div class="num" id="stat-due">R$ 0</div><div class="lbl">em aberto</div></div>
  </div>

  <section>
    <div class="section-head"><h2>Jogadores (elenco)</h2></div>
    <div class="add-row">
      <input type="text" id="player-name-input" placeholder="Nome do jogador">
      <button id="add-player-btn">Adicionar</button>
    </div>
    <div class="player-list" id="player-list"></div>
  </section>

  <section>
    <div class="section-head"><h2>Novo sábado</h2></div>
    <div class="new-session-box">
      <input type="date" id="session-date-input" style="margin-bottom:10px;">
      <p class="attendee-hint">Quem jogou nesse sábado?</p>
      <div class="attendee-pick" id="attendee-pick"></div>
      <button id="add-session-btn">Criar sábado</button>
    </div>
  </section>

  <section>
    <div class="section-head"><h2>Sábados registrados</h2></div>
    <div id="sessions-container"></div>
  </section>

  <section>
    <div class="section-head"><h2>Pendências</h2></div>
    <div class="pending-list" id="pending-list"></div>
  </section>

</main>

<script>
// PREENCHA_AQUI: cole aqui o objeto firebaseConfig que o Firebase te dá
// (Configurações do projeto > Seus apps > ícone Web </>)
const firebaseConfig = {
  apiKey: "AIzaSyAQ3astU8BnzOWhKnR2OEwroHfV8opaVQg",
  authDomain: "controle-futebol-a90d4.firebaseapp.com",
  databaseURL: "https://controle-futebol-a90d4-default-rtdb.firebaseio.com",
  projectId: "controle-futebol-a90d4",
  storageBucket: "controle-futebol-a90d4.firebasestorage.app",
  messagingSenderId: "1055623608881",
  appId: "1:1055623608881:web:5ee49ce827263bc75ab310"
};

firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('turma-sabado/dados');

const PRICE = 13;
let data = { players: [], sessions: [] };
let saveTimer = null;
let isRemoteUpdate = false;
let selectedAttendees = new Set();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function nextSaturday(){
  const d = new Date();
  const day = d.getDay();
  const diff = (6 - day + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function fmtDate(iso){
  const [y,m,dd] = iso.split('-');
  return `${dd}/${m}`;
}

function fmtBRL(n){
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function load(){
  document.getElementById('session-date-input').value = nextSaturday();

  dbRef.on('value', snapshot => {
    const statusEl = document.getElementById('sync-status');
    const val = snapshot.val();
    if(val){
      isRemoteUpdate = true;
      data.players = Array.isArray(val.players) ? val.players : [];
      data.sessions = Array.isArray(val.sessions) ? val.sessions : [];
      isRemoteUpdate = false;
    }
    statusEl.textContent = 'Sincronizado';
    render();
  }, error => {
    document.getElementById('sync-status').textContent = 'Erro de conexão — confira firebaseConfig';
    console.error(error);
  });
}

function scheduleSave(){
  if(isRemoteUpdate) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 250);
}

async function save(){
  try{
    document.getElementById('sync-status').textContent = 'Salvando…';
    await dbRef.set(data);
    document.getElementById('sync-status').textContent = 'Sincronizado';
  }catch(e){
    document.getElementById('sync-status').textContent = 'Erro ao salvar';
    console.error('erro ao salvar', e);
  }
}

function addPlayer(){
  const input = document.getElementById('player-name-input');
  const name = input.value.trim();
  if(!name) return;
  data.players.push({ id: uid(), name });
  input.value = '';
  scheduleSave();
  render();
}

function removePlayer(id){
  data.players = data.players.filter(p => p.id !== id);
  data.sessions.forEach(s => {
    delete s.payments[id];
    s.attendees = s.attendees.filter(pid => pid !== id);
  });
  selectedAttendees.delete(id);
  scheduleSave();
  render();
}

function toggleAttendeeSelection(id){
  if(selectedAttendees.has(id)) selectedAttendees.delete(id);
  else selectedAttendees.add(id);
  render();
}

function addSession(){
  const input = document.getElementById('session-date-input');
  const dateVal = input.value;
  if(!dateVal) return;
  if(data.sessions.some(s => s.date === dateVal)) return;
  if(selectedAttendees.size === 0) return;
  const payments = {};
  selectedAttendees.forEach(id => { payments[id] = false; });
  data.sessions.push({ id: uid(), date: dateVal, attendees: Array.from(selectedAttendees), payments });
  data.sessions.sort((a,b) => b.date.localeCompare(a.date));
  selectedAttendees = new Set();
  scheduleSave();
  render();
}

function removeSession(id){
  data.sessions = data.sessions.filter(s => s.id !== id);
  scheduleSave();
  render();
}

function togglePayment(sessionId, playerId){
  const session = data.sessions.find(s => s.id === sessionId);
  if(!session) return;
  session.payments[playerId] = !session.payments[playerId];
  scheduleSave();
  render();
}

function playerName(id){
  const p = data.players.find(pl => pl.id === id);
  return p ? p.name : '(removido)';
}

function render(){
  // player roster
  const list = document.getElementById('player-list');
  if(data.players.length === 0){
    list.innerHTML = '<div class="empty">Nenhum jogador cadastrado ainda.</div>';
  }else{
    list.innerHTML = data.players.map(p => `
      <div class="player-chip">
        ${escapeHtml(p.name)}
        <button data-remove-player="${p.id}" aria-label="Remover ${escapeHtml(p.name)}">&times;</button>
      </div>
    `).join('');
  }
  document.getElementById('stat-players').textContent = data.players.length;

  // attendee picker for new session
  const pick = document.getElementById('attendee-pick');
  if(data.players.length === 0){
    pick.innerHTML = '<span class="attendee-hint">Cadastre jogadores no elenco primeiro.</span>';
  }else{
    pick.innerHTML = data.players.map(p => `
      <label class="${selectedAttendees.has(p.id) ? 'checked' : ''}">
        <input type="checkbox" data-attendee-check="${p.id}" ${selectedAttendees.has(p.id) ? 'checked' : ''}>
        ${escapeHtml(p.name)}
      </label>
    `).join('');
  }
  document.getElementById('add-session-btn').disabled = selectedAttendees.size === 0;

  // sessions
  const container = document.getElementById('sessions-container');
  if(data.sessions.length === 0){
    container.innerHTML = '<div class="empty">Nenhum sábado registrado ainda.</div>';
  }else{
    container.innerHTML = data.sessions.map(s => {
      const attendees = s.attendees || [];
      const paidCount = attendees.filter(id => s.payments[id]).length;
      const rows = attendees.length === 0
        ? '<div class="empty">Sem jogadores marcados nesse sábado.</div>'
        : attendees.map(id => {
            const paid = !!s.payments[id];
            return `
              <div class="pay-row">
                <span class="pay-name">${escapeHtml(playerName(id))}</span>
                <button class="pay-toggle ${paid ? 'paid' : ''}" data-toggle-session="${s.id}" data-toggle-player="${id}">
                  ${paid ? 'Pago' : 'Pendente'}
                </button>
              </div>`;
          }).join('');
      return `
        <div class="session-card">
          <div class="session-head">
            <div>
              <div class="session-date">${fmtDate(s.date)}</div>
              <div class="session-sub">${paidCount}/${attendees.length} pagaram</div>
            </div>
            <button class="remove-session" data-remove-session="${s.id}" aria-label="Remover sábado">&times;</button>
          </div>
          ${rows}
        </div>`;
    }).join('');
  }

  // totals + pending
  let totalPaid = 0, totalDue = 0;
  const pendingByPlayer = {};

  data.sessions.forEach(s => {
    (s.attendees || []).forEach(id => {
      if(s.payments[id]){
        totalPaid += PRICE;
      }else{
        totalDue += PRICE;
        if(!pendingByPlayer[id]) pendingByPlayer[id] = [];
        pendingByPlayer[id].push(s.date);
      }
    });
  });

  document.getElementById('stat-paid').textContent = fmtBRL(totalPaid);
  document.getElementById('stat-due').textContent = fmtBRL(totalDue);

  const pendingEl = document.getElementById('pending-list');
  const pendingIds = Object.keys(pendingByPlayer).sort((a,b) => pendingByPlayer[b].length - pendingByPlayer[a].length);
  if(pendingIds.length === 0){
    pendingEl.innerHTML = '<div class="empty good">Ninguém devendo. Todo mundo em dia.</div>';
  }else{
    pendingEl.innerHTML = pendingIds.map(id => {
      const dates = pendingByPlayer[id].slice().sort();
      const total = dates.length * PRICE;
      const chips = dates.map(d => `<span class="pending-date-chip">${fmtDate(d)}</span>`).join('');
      return `
        <div class="pending-row">
          <div class="pending-top">
            <span class="pending-name">${escapeHtml(playerName(id))}</span>
            <span class="pending-total">${fmtBRL(total)}</span>
          </div>
          <div class="pending-dates">${chips}</div>
        </div>`;
    }).join('');
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('add-player-btn').addEventListener('click', addPlayer);
document.getElementById('player-name-input').addEventListener('keydown', e => { if(e.key === 'Enter') addPlayer(); });
document.getElementById('add-session-btn').addEventListener('click', addSession);

document.addEventListener('click', e => {
  const rp = e.target.closest('[data-remove-player]');
  if(rp){ removePlayer(rp.getAttribute('data-remove-player')); return; }
  const rs = e.target.closest('[data-remove-session]');
  if(rs){ removeSession(rs.getAttribute('data-remove-session')); return; }
  const tg = e.target.closest('[data-toggle-session]');
  if(tg){ togglePayment(tg.getAttribute('data-toggle-session'), tg.getAttribute('data-toggle-player')); return; }
});

document.addEventListener('change', e => {
  const ac = e.target.closest('[data-attendee-check]');
  if(ac){ toggleAttendeeSelection(ac.getAttribute('data-attendee-check')); return; }
});

load();
</script>

</body>
</html>
